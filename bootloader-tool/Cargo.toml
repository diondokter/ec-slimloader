[package]
name = "bootloader-tool"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }

object = { version = "0.39.1", features = ["build"] }
# Git version for probe-rs until 0.32 is released with mcxa577 support
probe-rs = { git = "https://github.com/probe-rs/probe-rs.git", rev = "a2957ce55e16120825f357d3a4a8a3e6b32a8b6e", default-features = false, features = ["builtin-formats", "builtin-targets"] }

tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }

anyhow = "1.0.102"
itertools = "0.15.0"

rand = "0.10.1"

serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1.2", features = ["serde"] }
serde_json = "1.0.150"

pretty_env_logger = "0.5"
log = "0.4.33"

hmac = "0.13.0"
sha2 = "0.11.0"
aes = "0.9.1"
rsa = { version = "=0.10.0-rc.18", features = ["sha2"] }
x509-parser = { version = "0.18.1", features = ["verify"] }

tempfile = "3.27.0"
